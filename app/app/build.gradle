plugins { id 'com.android.application' }
android {
    namespace 'com.swapos.launcher'
    compileSdk 34
    defaultConfig { applicationId "com.swapos.launcher"; minSdk 27; targetSdk 34; versionCode 1; versionName "0.1" }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    constraints { implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'align kotlin versions' } }
}
